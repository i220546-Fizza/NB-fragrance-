<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" fill="none">
  <defs>
    <radialGradient id="pedGlow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#D6B77C" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#D6B77C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pedRim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a5a2e"/>
      <stop offset="12%" stop-color="#e8c98a"/>
      <stop offset="28%" stop-color="#c9a96e"/>
      <stop offset="50%" stop-color="#f4e2b8"/>
      <stop offset="72%" stop-color="#c9a96e"/>
      <stop offset="88%" stop-color="#e8c98a"/>
      <stop offset="100%" stop-color="#7a5a2e"/>
    </linearGradient>
    <linearGradient id="pedTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a6c3d"/>
      <stop offset="15%" stop-color="#f4e2b8"/>
      <stop offset="35%" stop-color="#d6b77c"/>
      <stop offset="50%" stop-color="#fbeecb"/>
      <stop offset="65%" stop-color="#d6b77c"/>
      <stop offset="85%" stop-color="#f4e2b8"/>
      <stop offset="100%" stop-color="#8a6c3d"/>
    </linearGradient>
    <linearGradient id="pedSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9a96e"/>
      <stop offset="100%" stop-color="#5c451f"/>
