  </defs>

  <ellipse cx="450" cy="190" rx="380" ry="90" fill="url(#pedGlow)"/>

  <!-- cylinder side -->
  <path d="M120 150 v40 a330 62 0 0 0 660 0 v-40 z" fill="url(#pedSide)"/>
  <!-- lower rim -->
  <ellipse cx="450" cy="190" rx="330" ry="62" fill="url(#pedRim)"/>
  <ellipse cx="450" cy="184" rx="330" ry="58" fill="#1c130a" opacity="0.18"/>
  <!-- top disc -->
  <ellipse cx="450" cy="150" rx="330" ry="62" fill="url(#pedTop)"/>
  <ellipse cx="450" cy="150" rx="272" ry="48" fill="none" stroke="#5c451f" stroke-opacity="0.35" stroke-width="2"/>
  <ellipse cx="450" cy="146" rx="330" ry="60" fill="#ffffff" opacity="0.08"/>
</svg>
