<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 720" fill="none">
  <defs>
    <linearGradient id="essGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a2430" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#241820" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#0c0709" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="essLiquid" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#c98a8a"/>
      <stop offset="45%" stop-color="#d8b09a"/>
      <stop offset="100%" stop-color="#f4e2b8"/>
    </linearGradient>
    <linearGradient id="essCap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8e6e0"/>
      <stop offset="40%" stop-color="#d8b09a"/>
      <stop offset="75%" stop-color="#a1725c"/>
      <stop offset="100%" stop-color="#d6b77c"/>
    </linearGradient>
    <linearGradient id="essHighlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="essGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#e0a9a0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#e0a9a0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="210" cy="360" rx="170" ry="230" fill="url(#essGlow)"/>

  <!-- rounded teardrop cap -->
  <ellipse cx="210" cy="95" rx="46" ry="42" fill="url(#essCap)" stroke="#a1725c" stroke-width="2"/>
  <rect x="188" y="120" width="44" height="20" fill="url(#essCap)"/>

  <!-- neck -->
  <path d="M193 150 h34 v30 h-34 z" fill="url(#essGlass)" stroke="#d8b09a" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- body: curved teardrop bottle, wide base tapering up -->
  <path d="M210 180
           c50 0 70 30 76 70
           c8 54 34 70 34 150
           c0 98 -60 150 -110 150
           c-50 0 -110 -52 -110 -150
           c0 -80 26 -96 34 -150
           c6 -40 26 -70 76 -70 z"
        fill="url(#essGlass)" stroke="#d8b09a" stroke-opacity="0.55" stroke-width="2"/>

  <!-- liquid fill -->
  <path d="M104 400 c0 -34 8 -58 14 -80 h184 c6 22 14 46 14 80 c0 98 -60 150 -110 150 c-50 0 -110 -52 -110 -150 z"
        fill="url(#essLiquid)" opacity="0.9"/>

  <!-- sheen -->
  <rect x="100" y="360" width="220" height="16" fill="url(#essHighlight)" opacity="0.5"/>
  <path d="M140 230 c-20 34 -26 60 -30 96" stroke="#ffffff" stroke-opacity="0.35" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M290 260 c8 30 12 60 12 96" stroke="#ffffff" stroke-opacity="0.12" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- label -->
  <rect x="150" y="440" width="120" height="70" rx="30" fill="#f8f4ec" opacity="0.92"/>
  <text x="210" y="468" text-anchor="middle" font-family="Playfair Display, serif" font-size="15" fill="#3a2430" letter-spacing="2">NB</text>
  <text x="210" y="489" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#3a2430" letter-spacing="3">ESSENCE</text>
</svg>
