<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" fill="none">
  <defs>
    <linearGradient id="rib2Main" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4e2b8"/>
      <stop offset="30%" stop-color="#D6B77C"/>
      <stop offset="60%" stop-color="#D8B09A"/>
      <stop offset="100%" stop-color="#a97c5a"/>
    </linearGradient>
    <linearGradient id="rib2Sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="rib2Soft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F2E8DA" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F2E8DA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="500" cy="440" rx="430" ry="360" fill="url(#rib2Soft)"/>

  <!-- right wing (mirrored primary flow) -->
  <path d="M530 430
           C 640 380, 730 260, 850 250
           C 940 244, 970 300, 930 340
           C 870 396, 780 380, 710 430
           C 650 474, 620 520, 540 500
           C 500 490, 500 452, 530 430 Z"
        fill="url(#rib2Main)" opacity="0.94"/>
  <path d="M850 250 C 780 262, 700 330, 620 400" stroke="url(#rib2Sheen)" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- left wing -->
  <path d="M460 440
           C 340 400, 240 470, 140 460
           C 70 454, 50 390, 100 356
           C 160 316, 250 350, 310 320
           C 370 290, 390 250, 460 270
           C 500 282, 500 400, 460 440 Z"
        fill="url(#rib2Main)" opacity="0.9"/>
  <path d="M140 460 C 220 440, 300 400, 380 350" stroke="url(#rib2Sheen)" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.65"/>

  <ellipse cx="500" cy="440" rx="46" ry="30" fill="url(#rib2Main)"/>
  <ellipse cx="500" cy="432" rx="46" ry="16" fill="#ffffff" opacity="0.25"/>

  <circle cx="870" cy="300" r="8" fill="#D6B77C" opacity="0.7"/>
  <circle cx="910" cy="360" r="5" fill="#F2E8DA" opacity="0.75"/>
  <circle cx="100" cy="330" r="6" fill="#D8B09A" opacity="0.65"/>
  <circle cx="60" cy="410" r="4" fill="#F2E8DA" opacity="0.7"/>
  <circle cx="580" cy="700" r="5" fill="#D6B77C" opacity="0.6"/>
  <circle cx="380" cy="230" r="4" fill="#F2E8DA" opacity="0.6"/>
</svg>
