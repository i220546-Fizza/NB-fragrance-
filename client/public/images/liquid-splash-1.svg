<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" fill="none">
  <defs>
    <linearGradient id="rib1Main" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4e2b8"/>
      <stop offset="30%" stop-color="#D6B77C"/>
      <stop offset="60%" stop-color="#D8B09A"/>
      <stop offset="100%" stop-color="#a97c5a"/>
    </linearGradient>
    <linearGradient id="rib1Sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="rib1Soft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F2E8DA" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F2E8DA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft ambient wash behind the ribbon -->
  <ellipse cx="500" cy="440" rx="430" ry="360" fill="url(#rib1Soft)"/>

  <!-- left wing: flows from the bottle neck outward and up -->
  <path d="M470 430
           C 360 380, 270 260, 150 250
           C 60 244, 30 300, 70 340
           C 130 396, 220 380, 290 430
           C 350 474, 380 520, 460 500
           C 500 490, 500 452, 470 430 Z"
        fill="url(#rib1Main)" opacity="0.94"/>
  <path d="M150 250 C 220 262, 300 330, 380 400" stroke="url(#rib1Sheen)" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- right wing: flows from the bottle neck outward and down -->
  <path d="M540 440
           C 660 400, 760 470, 860 460
           C 930 454, 950 390, 900 356
           C 840 316, 750 350, 690 320
           C 630 290, 610 250, 540 270
           C 500 282, 500 400, 540 440 Z"
        fill="url(#rib1Main)" opacity="0.9"/>
  <path d="M860 460 C 780 440, 700 400, 620 350" stroke="url(#rib1Sheen)" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.65"/>

  <!-- knot where the ribbon gathers, sits behind the bottle neck -->
  <ellipse cx="500" cy="440" rx="46" ry="30" fill="url(#rib1Main)"/>
  <ellipse cx="500" cy="432" rx="46" ry="16" fill="#ffffff" opacity="0.25"/>

  <!-- droplets -->
  <circle cx="130" cy="300" r="8" fill="#D6B77C" opacity="0.7"/>
  <circle cx="90" cy="360" r="5" fill="#F2E8DA" opacity="0.75"/>
  <circle cx="900" cy="330" r="6" fill="#D8B09A" opacity="0.65"/>
  <circle cx="940" cy="410" r="4" fill="#F2E8DA" opacity="0.7"/>
  <circle cx="420" cy="700" r="5" fill="#D6B77C" opacity="0.6"/>
  <circle cx="620" cy="230" r="4" fill="#F2E8DA" opacity="0.6"/>
</svg>
