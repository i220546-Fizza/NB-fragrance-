<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 720" fill="none">
  <defs>
    <linearGradient id="midGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161b3a" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#0d1024" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#06060f" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="midLiquid" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#242b6b"/>
      <stop offset="45%" stop-color="#4a3a86"/>
      <stop offset="80%" stop-color="#a9678f"/>
      <stop offset="100%" stop-color="#d8b09a"/>
    </linearGradient>
    <linearGradient id="midCap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0d9e2"/>
      <stop offset="35%" stop-color="#d8b09a"/>
      <stop offset="70%" stop-color="#8a5c6c"/>
      <stop offset="100%" stop-color="#c9a96e"/>
    </linearGradient>
    <linearGradient id="midHighlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="midGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#6a5acd" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#6a5acd" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="210" cy="360" rx="170" ry="230" fill="url(#midGlow)"/>

  <!-- hexagonal faceted cap -->
  <path d="M180 55 l60 0 l24 24 l0 46 l-24 24 l-60 0 l-24 -24 l0 -46 z" fill="url(#midCap)" stroke="#8a5c6c" stroke-width="2"/>
  <line x1="210" y1="55" x2="210" y2="149" stroke="#00000022" stroke-width="2"/>

  <!-- neck -->
  <path d="M188 149 h44 v36 h-44 z" fill="url(#midGlass)" stroke="#d8b09a" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- body: faceted hexagonal bottle -->
  <path d="M210 185
           l90 52
           v96
           l0 180
           l-90 52
           l-90 -52
           v-180
           v-96
           z"
        fill="url(#midGlass)" stroke="#d8b09a" stroke-opacity="0.5" stroke-width="2"/>

  <!-- liquid fill -->
  <path d="M120 380 l90 -32 l90 32 v133 l-90 52 l-90 -52 z" fill="url(#midLiquid)" opacity="0.9"/>

  <!-- facet edges -->
  <line x1="210" y1="185" x2="210" y2="565" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>
  <line x1="120" y1="237" x2="300" y2="237" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
  <line x1="120" y1="417" x2="210" y2="469" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>
  <line x1="300" y1="417" x2="210" y2="469" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- sheen -->
  <rect x="120" y="330" width="180" height="14" fill="url(#midHighlight)" opacity="0.5"/>
  <path d="M150 220 v300" stroke="#ffffff" stroke-opacity="0.25" stroke-width="6" stroke-linecap="round"/>

  <!-- label -->
  <rect x="150" y="430" width="120" height="70" rx="4" fill="#f8f4ec" opacity="0.92"/>
  <text x="210" y="457" text-anchor="middle" font-family="Playfair Display, serif" font-size="15" fill="#241d3a" letter-spacing="2">NB</text>
  <text x="210" y="478" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#241d3a" letter-spacing="3">MIDNIGHT</text>
</svg>
